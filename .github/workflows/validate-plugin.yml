# Validate the manifests and frontmatter, then assert the repo invariants
# `claude plugin validate` cannot see (doc-set shape, dead links, per-skill rules).
# `--strict` is informational only: it fails solely on the deliberate `version`
# omission, and becomes blocking once semver is pinned.
name: validate-plugin

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate manifests (blocking)
        run: claude plugin validate .

      - name: Repo invariants (blocking)
        run: bash scripts/check-invariants.sh

      - name: Strict validate (informational)
        run: claude plugin validate . --strict
        continue-on-error: true
